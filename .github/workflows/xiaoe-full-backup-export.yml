name: XiaoE Full Backup Export
on:
  push:
    branches:
      - xiaoe-full-backup-20260908
jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build offline Git bundle and pinned source archive
        shell: bash
        run: |
          set -euo pipefail
          git bundle create xiaoe-core-v2-full.bundle --all
          git archive --format=zip --output=xiaoe-core-v2-main-720f84f.zip 720f84f652210b37a1793a02db66e78f6d99d268
          sha256sum xiaoe-core-v2-full.bundle xiaoe-core-v2-main-720f84f.zip > SHA256SUMS_GITHUB.txt
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaoe-core-v2-full-backup-20260908
          path: |
            xiaoe-core-v2-full.bundle
            xiaoe-core-v2-main-720f84f.zip
            SHA256SUMS_GITHUB.txt
          if-no-files-found: error
          retention-days: 7
